<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedWay AI Video</title>
    
    <link rel="icon" href="https://img.icons8.com/?size=100&id=Jl4RFd9wbcRM&format=png&color=000000" type="image/png">

    <style>
        /* Removes all margins and scrollbars, sets background to black */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* Forces the iframe to take up the entire viewport */
        .fullscreen-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border: none;
        }
    </style>
</head>
<body>

    <iframe 
        class="fullscreen-bg" 
        src="https://www.youtube.com/embed/KBt68tTSpn0?autoplay=1&mute=1" 
        title="MedWay AI | AI-Powered Healthcare Assistant | AI Buildathon 2026" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        allowfullscreen>
    </iframe>

</body>
</html>
