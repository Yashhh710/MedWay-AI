<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MEDWAY AI - Loading</title>
<link rel="icon" type="image/png" href="https://img.icons8.com/?size=100&id=64004&format=png&color=000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --red-accent: #EB1616;
    --red-glow: rgba(235, 22, 22, 0.6);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000000;
    overflow: hidden;
    font-family: 'Inter', -apple-system, sans-serif;
  }

  /* ============ LOADING SCREEN ============ */

  #loading-screen {
    position: fixed;
    inset: 0;
    background: #000000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity .6s ease;
  }

  #loading-screen.fade-out {
    opacity: 0;
    pointer-events: none;
  }

  .logo-wrap {
    position: relative;
    width: 85vw;
    max-width: 1000px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #logo-svg {
    width: 100%;
    height: auto;
    display: block;
    filter: drop-shadow(0 0 10px var(--red-glow));
    transition: opacity .6s ease, filter .7s ease;
  }

  /* --- STAGGERED LEFT-TO-RIGHT DRAWING --- */

  .draw-seq {
    fill: none;
    stroke: var(--red-accent);
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 1000;
    stroke-dashoffset: 1000;
    animation: drawLeftToRight 0.8s linear forwards;
  }

  /* Stagger delays so the stroke moves sequentially left -> right */
  .seq-1 { animation-delay: 0.0s; }
  .seq-2 { animation-delay: 0.5s; }
  .seq-3 { animation-delay: 1.8s; }

  @keyframes drawLeftToRight {
    to {
      stroke-dashoffset: 0;
    }
  }

  /* Text Stroke drawing left-to-right */
  .stroke-text {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 900;
    font-size: 76px;
    fill: transparent;
    stroke: var(--red-accent);
    stroke-width: 2;
    letter-spacing: 5px;
    stroke-dasharray: 1200;
    stroke-dashoffset: 1200;
    animation: drawLeftToRight 1.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    animation-delay: 0.5s;
  }

  #logo-svg.dissolve {
    opacity: 0;
    filter: blur(4px) drop-shadow(0 0 0 rgba(0,0,0,0));
  }

  /* --- SOLID LOGO REVEAL --- */

  .solid-logo {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 900;
    letter-spacing: 0.05em;
    font-size: clamp(2.2rem, 6vw, 5rem);
    color: #ffffff;
    opacity: 0;
    filter: blur(3px);
    transform: scale(0.98);
    transition: opacity .7s cubic-bezier(.22, .9, .36, 1),
                filter .7s cubic-bezier(.22, .9, .36, 1),
                transform .7s cubic-bezier(.22, .9, .36, 1);
  }

  .solid-logo span {
    color: var(--red-accent);
  }

  .solid-logo.show {
    opacity: 1;
    filter: blur(0);
    transform: scale(1);
  }

  /* --- SUBTITLE & STATUS --- */

  .sub-block {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    margin-top: 1.4rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.6rem;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity .6s ease, transform .6s ease;
  }

  .sub-block.show {
    opacity: 1;
    transform: translateY(0);
  }

  .tagline {
    font-size: clamp(0.75rem, 1.4vw, 0.95rem);
    color: rgba(255, 255, 255, 0.55);
    letter-spacing: 0.03em;
    font-weight: 400;
  }

  .init-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: clamp(0.65rem, 1.1vw, 0.78rem);
    color: var(--red-accent);
    letter-spacing: 0.14em;
    font-weight: 500;
  }

  .init-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--red-accent);
    box-shadow: 0 0 6px var(--red-accent);
    animation: pulse 1.1s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.25; transform: scale(0.85); }
    50% { opacity: 1; transform: scale(1.1); }
  }
</style>
</head>
<body>

  <div id="loading-screen">
    <div class="logo-wrap">
      <svg id="logo-svg" viewBox="0 0 1000 160" xmlns="http://www.w3.org/2000/svg">
        <!-- 1. Left ECG Line (Draws 0s - 0.5s) -->
        <path class="draw-seq seq-1" d="M 0 80 H 120 L 135 110 L 150 20 L 170 140 L 185 80 H 220" />
        
        <!-- 2. MEDWAY AI Text (Draws 0.5s - 1.9s Left -> Right) -->
        <text x="500" y="105" text-anchor="middle" class="stroke-text">MEDWAY AI</text>

        <!-- 3. Right ECG Line (Draws 1.8s - 2.6s) -->
        <path class="draw-seq seq-3" d="M 780 80 H 815 L 830 110 L 845 20 L 865 140 L 880 80 H 1000" />
      </svg>

      <div class="solid-logo" id="solid-logo">MEDWAY <span>AI</span></div>

      <div class="sub-block" id="sub-block">
        <div class="tagline">Healthcare, wherever you travel.</div>
        <div class="init-row"><span class="init-dot"></span>INITIALIZING...</div>
      </div>
    </div>
  </div>

  <script>
    (function(){
      var svg = document.getElementById('logo-svg');
      var solid = document.getElementById('solid-logo');
      var subBlock = document.getElementById('sub-block');
      var screenEl = document.getElementById('loading-screen');

      function goToDashboard(){
        screenEl.classList.add('fade-out');
        setTimeout(function(){
          window.location.href = "index.html?loaded=true";
        }, 600);
      }

      var DRAW_TOTAL_MS = 2600;
      var HOLD_MS = 300;
      var FILL_MS = 600;

      // Dissolve wireframe and reveal solid white/red text
      setTimeout(function(){
        svg.classList.add('dissolve');
        solid.classList.add('show');
      }, DRAW_TOTAL_MS + HOLD_MS);

      // Fade in tagline
      setTimeout(function(){
        subBlock.classList.add('show');
      }, DRAW_TOTAL_MS + HOLD_MS + FILL_MS - 150);

      // Redirect to dashboard
      setTimeout(goToDashboard, DRAW_TOTAL_MS + HOLD_MS + FILL_MS + 1000);
    })();
  </script>

</body>
</html>
